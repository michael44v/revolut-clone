name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it manually from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Builds on EAS servers. Prints a download link for the APK when finished.
      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive --wait